<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <h1>Biblioteca Virtual</h1>

  <main class="container">
    <h2>Bem-vindo à Biblioteca Virtual</h2>
    <p>Explore a coleção e encontre seu próximo livro favorito!</p>

    <div class="tabs" aria-label="Abas da Biblioteca">
      <button class="tab-button active" type="button" data-tab="livros">Livros</button>
      <button class="tab-button" type="button" data-tab="sorteio">Sorteio</button>
    </div>

    <section id="tab-livros" class="tab-panel active">
      <div id="livroGrid" class="livro-grid" aria-live="polite"></div>
    </section>

    <section id="tab-sorteio" class="tab-panel">
      <div class="sorteador">
        <h3>Sorteador</h3>
        <div class="botoes-sorteio">
          <button id="sortearLivro" type="button">Sortear livro</button>
        </div>
        <div class="resultado" id="resultadoTexto">
          Clique no botão para descobrir sua próxima leitura.
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Biblioteca Virtual. Todos os direitos reservados.</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
